org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# Keep real resource paths (res/drawable-xhdpi-v4/ic_launcher.png) instead of aapt2-shortened
# ones (res/9w.png). Fire TV reads a sideloaded app's launcher icon straight out of the APK by
# path, and an obfuscated path leaves the app with no tile on the home screen.
android.enableResourceOptimizations=false
